# Docker Compose 本地配置模板。
# 复制为 config/config.local.yaml 后填写真实 Key；local 文件已被 Git 忽略。

llm:
  api_url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
  api_key: ""
  model: deepseek-v4-flash-260425

embedding:
  api_url: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
  api_key: ""
  model: doubao-embedding-vision-250615

milvus:
  host: milvus
  port: 19530

postgres:
  host: postgres
  port: 5432
  user: aiagent
  password: aiagent123
  database: aiagent

elasticsearch:
  addresses:
    - http://elasticsearch:9200
  username: ""
  password: ""

kafka:
  brokers:
    - kafka:19092
  topic: agent-events

rag:
  chunk_size: 200
  chunk_overlap: 50
  top_k: 3
  rrf_constant_k: 60
  semantic_weight: 0.7
  enable_hybrid_search: true
  rag_milvus_dim: 2048
  rewrite:
    enabled: true
    num_queries: 3
  rerank:
    enabled: true
    preview_len: 200

memory:
  short_term_max_turns: 5
  long_term_top_k: 3
  consolidation:
    similarity_threshold: 0.80
    dedup_threshold: 0.95
    ttl_days: 30
    decay_rate: 0.995
    min_importance: 0.3
    trigger_interval: 5

harness:
  max_retries: 3
  retry_delay_ms: 200
  step_timeout_ms: 5000
  max_iterations: 5

graph_runtime:
  max_parallel: 2
  race_timeout_ms: 30000
  enable_racing: true

server:
  port: "8090"

search:
  api_key: ""
  api_url: https://tavily.com

neo4j:
  uri: bolt://neo4j:7687
  user: neo4j
  password: password123
  max_hops: 2
  weight: 0.3
  enabled: true

sandbox:
  enabled: false
  backend: docker
  image: ubuntu:22.04
  timeout_ms: 30000
  max_output_bytes: 65536
  memory_limit_mb: 256
  cpu_percent: 50
  max_pids: 64
  network_disabled: true
  readonly_rootfs: true

security:
  max_command_length: 500
  allowlist_mode: false
  allowlist:
    - ls
    - cat
    - echo
    - pwd
    - date
    - python3
    - node
    - go
    - java
